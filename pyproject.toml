[project]
name = "mcp-sonarcloud"
version = "0.2.0"
description = "MCP server for SonarCloud"
authors = [{name = "Lukas Lehner", email = "lehner.lukas@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "sonarcloud", "code-quality", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # The server builds on mcp.server.mcpserver (the 2.x successor to FastMCP).
    # Capped below 3 so the next major SDK rewrite cannot silently break installs
    # the way 2.0.0 did when it removed mcp.server.fastmcp.
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/lukleh/mcp-sonarcloud"
Repository = "https://github.com/lukleh/mcp-sonarcloud"
Issues = "https://github.com/lukleh/mcp-sonarcloud/issues"
Changelog = "https://github.com/lukleh/mcp-sonarcloud/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    # Capped to one minor: ruff's implicit default rule set changes between
    # minors (0.16 widened it), so a routine relock must not change lint
    # behavior. Bumping the cap is a deliberate, separate change.
    "ruff>=0.16,<0.17",
    "ty>=0.0.28",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.vulture]
paths = ["src", "tests"]
exclude = [".venv", "venv", "build", "dist", "node_modules", "__pycache__", "site-packages"]
ignore_decorators = ["@*.tool*", "@pytest.fixture"]
ignore_names = ["pytest_*"]
min_confidence = 80

[project.scripts]
mcp-sonarcloud = "mcp_sonarcloud.server:main"

[tool.ty.src]
include = ["src"]
