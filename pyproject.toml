[project]
name = "mcp-sonarcloud"
version = "0.1.4"
description = "MCP server for SonarCloud"
authors = [{name = "Lukas Lehner", email = "lehner.lukas@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["mcp", "sonarcloud", "code-quality", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Floor: mcp.server.fastmcp first shipped in 1.2.0, and FastMCP only emits
    # outputSchema / structured content from 1.10.0 — on older 1.x the server
    # still starts but silently drops the output schemas its tools declare.
    # Cap: 2.0.0 removed mcp.server.fastmcp outright. Keep the cap until the
    # server is ported to the 2.x API.
    "mcp>=1.10.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/lukleh/mcp-sonarcloud"
Repository = "https://github.com/lukleh/mcp-sonarcloud"
Issues = "https://github.com/lukleh/mcp-sonarcloud/issues"
Changelog = "https://github.com/lukleh/mcp-sonarcloud/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.15.9",
    "ty>=0.0.28",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.vulture]
paths = ["src", "tests"]
exclude = [".venv", "venv", "build", "dist", "node_modules", "__pycache__", "site-packages"]
ignore_decorators = ["@*.tool*", "@pytest.fixture"]
ignore_names = ["pytest_*"]
min_confidence = 80

[project.scripts]
mcp-sonarcloud = "mcp_sonarcloud.server:main"

[tool.ty.src]
include = ["src"]
